# =============================================================================
# Docker Maintenance - Auto-merge Dependabot PRs
# =============================================================================
# Decides on every Dependabot PR, whatever its ecosystem: a patch update
# merges only after docker-release.yml built the image on the PR (base
# image and pip updates in src/); everything else stays open with an
# annotation.
# A merge made with the GITHUB_TOKEN starts no push workflow, so after the
# merge this workflow dispatches docker-release.yml on main and waits for
# it (release-workflow). That run builds the merged commit again and only
# then:
# 1. Creates a semantic release
# 2. Builds and pushes the new Docker image
# A release run that does not succeed turns this job red.
#
# Flow:
# ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐
# │  Dependabot     │────▶│  PR Created     │────▶│  Docker Build   │
# │  Finds Update   │     │  (base image)   │     │  Validates      │
# └─────────────────┘     └─────────────────┘     └────────┬────────┘
#                                                          │
#                                                          ▼
# ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐
# │  New Release    │◀────│  Auto-Merged    │◀────│  All Checks     │
# │  + Docker Push  │     │  to main        │     │  Pass ✅        │
# └─────────────────┘     └─────────────────┘     └─────────────────┘
# =============================================================================

name: 🔧 Docker Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths filter: every Dependabot PR (docker, pip, ...) gets a decision
    # and an annotation instead of silently staying open. Whether it merges
    # is decided by required-workflows below; GitHub Actions updates and
    # changes under .github/ always stay open for review.

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the image. Its pull_request paths (src/**) cover the base
      # image in src/Dockerfile and the pip packages in src/requirements.txt
      # that the build installs; a PR outside them stays open (not tested).
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it: it rebuilds the merged commit before it releases it,
      # and a failed release run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
